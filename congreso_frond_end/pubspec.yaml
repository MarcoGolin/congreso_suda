name: congreso_evento
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+51

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_modular: ^6.4.1
  cupertino_icons: ^1.0.8
  parallax_animation: ^0.0.3
  animate_do: ^4.2.0
  url_launcher: ^6.3.1
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.2.0
  supabase_flutter: ^2.9.1
  yaml: ^3.1.2
  flutter_launcher_icons: ^0.14.4
  mobile_scanner: ^5.1.1
  loading_animation_widget: ^1.3.0
  intl: ^0.20.2
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^10.9.1
  share_plus: ^11.1.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  flutter_masked_text2: ^0.9.1
  excel: ^4.0.6
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  dropdown_search: ^6.0.2
  syncfusion_flutter_charts: ^31.1.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  mobx_codegen: ^2.7.1
  build_runner: ^2.4.15

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/imagenes/logo/
    - assets/imagenes/ligas_academicas/
    - assets/imagenes/personas/
    - assets/imagenes/fondo/
    - assets/imagenes/evento/
    - assets/carnet/
    - pubspec.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          style: italic
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
targets:
  $default:
    builders:
      json_serializable:
        options:
          # Options configure how source code is generated for every
          # @JsonSerializable-annotated class in the package.
          #
          # The default value for each is listed.
          any_map: false
          checked: false
          constructor: ""
          create_factory: true
          create_constructor: true
          create_field_map: true
          create_per_field_to_json: false
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: true

