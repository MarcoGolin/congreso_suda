  <!-- CSS crítico inline: preloader -->
  <style>
    /* Evita flash blanco y desplazamiento mientras carga */
    html, body { height: 100%; margin: 0; background: #121a14; }
    body.preload-lock { overflow: hidden; }

    /* Preloader full-screen */
    #preloader {
      position: fixed; inset: 0; z-index: 99999;
      display: grid; place-items: center;
      opacity: 1; transition: opacity .28s ease;
      background:
        radial-gradient(1200px 800px at 50% -10%, #2e6b40 0%, #121a14 60%);
    }
    #preloader::before {
      content: "";
      position: absolute; inset: 0;
      background: url("assets/imagenes/fondo/fondo_liviano.webp?v=1") center/cover no-repeat;
      filter: brightness(.9);
      opacity: .55;
    }
    .splash-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 24px 28px;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0,0,0,.38);
    }
    .splash-card img { width: 220px; height: auto; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #preloader[aria-hidden="true"] { display: none; }
  </style>

<body class="preload-lock">

  <!-- Redirección solo si no hay SW ni modo standalone (no rompe PWA instalada) -->
  <script>
    (function () {
      var isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      var hasSW = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
      if (isStandalone || hasSW) return;

      var baseEl = document.querySelector('base');
      var basePath = baseEl ? new URL(baseEl.href, location.href).pathname : '/';
      if (!basePath.endsWith('/')) basePath += '/';

      var atRoot =
        location.pathname === basePath ||
        location.pathname === basePath + 'index.html';

      if (!atRoot) {
        sessionStorage.setItem('flutter_intended_route',
          (location.pathname + location.search + location.hash) || '/');
        location.replace(basePath);
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- Bootstrap de Flutter -->
  <script src="flutter_bootstrap.js" defer></script>

  <!-- Preloader: se apaga al primer frame o a los 6s -->
  <script>
    (function () {
      const pre = document.getElementById('preloader');
      const start = performance.now();

      function fadeOutAndRemove(minVisibleMs) {
        const elapsed = performance.now() - start;
        const wait = Math.max(0, (minVisibleMs || 700) - elapsed);
        setTimeout(() => {
          if (!pre) return;
          pre.style.opacity = '0';
          setTimeout(() => {
            pre.setAttribute('aria-hidden', 'true');
            pre.remove();
            document.body.classList.remove('preload-lock');
          }, 320);
        }, wait);
      }

      window.addEventListener('app-ready', () => fadeOutAndRemove(700));
      window.addEventListener('flutter-first-frame', () => {
        if (document.getElementById('preloader')) {
          setTimeout(() => fadeOutAndRemove(700), 150);
        }
      });
      setTimeout(() => {
        if (document.getElementById('preloader')) fadeOutAndRemove(700);
      }, 6000);

      const hero = new Image();
      hero.src = 'assets/imagenes/fondo/fondo_liviano.webp?v=1';
    })();
  </script>
