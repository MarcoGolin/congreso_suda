  <!-- Remueve el preloader en el primer frame de Flutter (rápido) -->
<script>
  (function () {
    const pre = document.getElementById('preloader');
    const start = performance.now();

    // Fade & remove con mínimo visible
    function fadeOutAndRemove(minVisibleMs) {
      const elapsed = performance.now() - start;
      const wait = Math.max(0, (minVisibleMs || 700) - elapsed); // min 700ms de splash
      setTimeout(() => {
        if (!pre) return;
        pre.style.opacity = '0';
        setTimeout(() => {
          pre.setAttribute('aria-hidden', 'true');
          pre.remove();
          document.body.classList.remove('preload-lock');
        }, 320);
      }, wait);
    }

    // 1) Señal primaria: cuando Flutter (tu código) diga que está listo
    window.addEventListener('app-ready', () => fadeOutAndRemove(700));

    // 2) Fallback: 150ms DESPUÉS del primer frame de Flutter (da tiempo a Material/primer build)
    window.addEventListener('flutter-first-frame', () => {
      // solo si aún no se disparó app-ready
      if (document.getElementById('preloader')) {
        setTimeout(() => fadeOutAndRemove(700), 150);
      }
    });

    // 3) Safety timeout: si nada llegó, apagá a los 6s
    setTimeout(() => {
      if (document.getElementById('preloader')) fadeOutAndRemove(700);
    }, 6000);

    // Precalienta la imagen de fondo liviana (opcional)
    const hero = new Image();
    hero.src = 'assets/imagenes/fondo/fondo_liviano.webp';
  })();
</script>
